name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py xlsx_export.py scripts
      - name: Validate published JSON
        run: |
          python -m json.tool budsjett/data.json > /dev/null
          python -m json.tool timeplanside/timeplan-2027.json > /dev/null
